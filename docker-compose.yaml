services:
  client:
    build: .
    environment:
      API_PROXY_SERVER: ${API_PROXY_SERVER}
    healthcheck:
      test: "wget --spider -q http://client:8080/actuator/health || exit 1"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 160s
    ports:
      - "${CLIENT_PORT}:8080"
    depends_on:
      server:
        condition: service_healthy
  server:
    build: ../auction/.
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_GRPC_PORT: ${SERVER_GRPC_PORT}
    healthcheck:
      test: [ "CMD", "grpc_health_probe", "-addr=127.0.0.1:${SERVER_GRPC_PORT}" ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 160s
    ports:
      - "${SERVER_GRPC_PORT}:${SERVER_GRPC_PORT}"
    depends_on:
      db:
        condition: service_healthy
  db:
    container_name: auction-db
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - auction_vol:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d auction" ]
      interval: 30s
      timeout: 10s
  fronted:
    build:
      context: frontend/.
    container_name: auction-frontend
    environment:
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET}
    ports:
      - "${FRONTEND_PORT}:4173"
    depends_on:
      client:
        condition: service_healthy
volumes:
  auction_vol:
    driver: local